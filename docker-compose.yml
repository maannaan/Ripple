services:
  postgres:
    image: postgres:16-alpine
    container_name: ripple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ripple
      POSTGRES_DB: ripple
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ripple_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripple -d ripple"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ripple_pg_data:
